<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 262" width="1040" height="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">How GroundWire wraps a TinyFish run</title><path d="M30 62H1004" stroke="#6e7681" stroke-width="2" fill="none"/><path d="M1000 56L1012 62L1000 68Z" fill="#6e7681"/><path d="M528 62V146q0 12 -12 12H312q-12 0 -12 -12V80" stroke="#2ea043" stroke-width="2.5" fill="none"/><path d="M293 82L300 69L307 82Z" fill="#2ea043"/><path d="M574 62V222" stroke="#2ea043" stroke-width="2.5" fill="none"/><path d="M564 222H584" stroke="#2ea043" stroke-width="4" fill="none"/><path d="M280 62H590" stroke="#2ea043" stroke-width="11" fill="none"/><path d="M280 62H590" stroke="#e3b341" stroke-width="3.5" stroke-dasharray="16 10" fill="none"/><circle cx="300" cy="62" r="6.5" fill="#0d1117" stroke="#2ea043" stroke-width="2.5"/><circle cx="346" cy="62" r="6.5" fill="#0d1117" stroke="#2ea043" stroke-width="2.5"/><circle cx="392" cy="62" r="6.5" fill="#0d1117" stroke="#2ea043" stroke-width="2.5"/><circle cx="438" cy="62" r="6.5" fill="#0d1117" stroke="#2ea043" stroke-width="2.5"/><circle cx="484" cy="62" r="6.5" fill="#0d1117" stroke="#2ea043" stroke-width="2.5"/><circle cx="530" cy="62" r="6.5" fill="#0d1117" stroke="#2ea043" stroke-width="2.5"/><circle cx="576" cy="62" r="6.5" fill="#0d1117" stroke="#2ea043" stroke-width="2.5"/><circle cx="30" cy="62" r="5" fill="#6e7681"/><circle cx="145" cy="62" r="5" fill="#6e7681"/><circle cx="640" cy="62" r="5" fill="#6e7681"/><circle cx="760" cy="62" r="5" fill="#6e7681"/><circle cx="875" cy="62" r="5" fill="#6e7681"/><text x="30" y="40" font-size="17" font-weight="600" fill="#e6edf3">Allowlist</text><text x="30" y="92" font-size="14" fill="#9198a1">Wrong domain?</text><text x="30" y="112" font-size="14" fill="#9198a1">Stops here</text><text x="145" y="40" font-size="17" font-weight="600" fill="#e6edf3">Memory</text><text x="145" y="92" font-size="14" fill="#9198a1">Briefs the agent</text><text x="145" y="112" font-size="14" fill="#9198a1">on this site</text><text x="280" y="40" font-size="17" font-weight="600" fill="#e6edf3">TinyFish agent, checked every 5 events</text><text x="640" y="40" font-size="17" font-weight="600" fill="#e6edf3">Blocked?</text><text x="640" y="92" font-size="14" fill="#9198a1">Retries on a</text><text x="640" y="112" font-size="14" fill="#9198a1">stealth profile</text><text x="760" y="40" font-size="17" font-weight="600" fill="#e6edf3">Learn</text><text x="760" y="92" font-size="14" fill="#9198a1">Saves what</text><text x="760" y="112" font-size="14" fill="#9198a1">it found</text><text x="875" y="40" font-size="17" font-weight="600" fill="#e6edf3">Scrub</text><text x="875" y="92" font-size="14" fill="#9198a1">Removes PII</text><text x="875" y="112" font-size="14" fill="#9198a1">from the result</text><text x="967" y="40" font-size="17" font-weight="600" fill="#e6edf3">Result</text><text x="320" y="102" font-size="15" fill="#e6edf3">Drifting on 2 checks in a row:</text><text x="320" y="122" font-size="15" fill="#e6edf3">test a fix, then replan</text><text x="592" y="196" font-size="15" fill="#e6edf3">CAPTCHA loop: stop the run</text><text x="592" y="216" font-size="15" fill="#e6edf3">and hand it to a person</text></svg>